<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pokédex · Adrian Lara</title>
  <meta name="description" content="A Pokédex built with plain JavaScript and PokéAPI.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #000000;
      --raised: #1a1a1a;
      --line: #2d2d2d;
      --dim: #8a8a8a;
      --text: #d9d9d9;
      --bright: #ffffff;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #ffffff;
        --raised: #f2f2f2;
        --line: #d4d4d4;
        --dim: #666666;
        --text: #262626;
        --bright: #000000;
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html { -webkit-text-size-adjust: 100%; }

    body {
      font-family: "Fira Code", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
      font-size: 15px;
      line-height: 1.6;
      background: var(--bg);
      color: var(--text);
    }

    ::selection { background: var(--bright); color: var(--bg); }

    a {
      color: var(--bright);
      text-decoration: underline;
      text-decoration-color: var(--line);
      text-underline-offset: 4px;
    }
    a:hover { background: var(--bright); color: var(--bg); text-decoration: none; }
    a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible {
      outline: 1px solid var(--bright);
      outline-offset: 2px;
    }

    .wrap { max-width: 1120px; margin: 0 auto; padding: 48px 20px 64px; }

    /* ---------- Header ---------- */
    .path { color: var(--dim); }
    .path a { color: var(--bright); }
    h1 {
      font-size: clamp(2.2rem, 7vw, 3.5rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.1;
      color: var(--bright);
      margin: 14px 0 6px;
    }
    .sub { color: var(--dim); margin-bottom: 32px; }

    /* ---------- Controls ---------- */
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 12px 24px;
      align-items: center;
      padding: 14px 0;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      margin-bottom: 24px;
    }
    .field { display: flex; align-items: center; gap: 1ch; }
    .field label { color: var(--dim); }
    .search { flex: 1 1 280px; }
    .controls input, .controls select {
      font: inherit;
      color: var(--bright);
      background: transparent;
      border: none;
      border-bottom: 1px solid var(--line);
      border-radius: 0;
      padding: 4px 0;
    }
    .controls input { width: 100%; }
    .controls input::placeholder { color: var(--dim); opacity: .7; }
    .controls select { cursor: pointer; padding-right: 4px; }
    .controls select option { background: var(--bg); color: var(--text); }
    .count { color: var(--dim); margin-left: auto; }

    /* ---------- Grid ---------- */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
      gap: 12px;
    }

    .card {
      font: inherit;
      color: inherit;
      text-align: left;
      cursor: pointer;
      background: transparent;
      border: 1px solid var(--line);
      padding: 12px;
      display: flex;
      flex-direction: column;
    }
    .card[hidden] { display: none; }
    .card:hover, .card:focus-visible { border-color: var(--bright); }

    /* Artwork stays grayscale until you point at it */
    .card img {
      width: 100%;
      aspect-ratio: 1;
      object-fit: contain;
      filter: grayscale(1) contrast(1.05);
      opacity: .85;
      margin-bottom: 10px;
    }
    .card:hover img, .card:focus-visible img { filter: none; opacity: 1; }

    .num { color: var(--dim); font-size: 13px; }
    .name { color: var(--bright); font-weight: 500; }

    .types { display: flex; flex-wrap: wrap; gap: 0 1ch; margin-top: 4px; font-size: 13px; color: var(--text); min-height: 1.6em; }
    .type::before { content: "["; color: var(--dim); }
    .type::after { content: "]"; color: var(--dim); }
    .types .pending { color: var(--dim); }

    /* ---------- Status + buttons ---------- */
    .status { color: var(--dim); padding: 32px 0; }
    .btn {
      font: inherit;
      cursor: pointer;
      color: var(--bright);
      background: transparent;
      border: 1px solid var(--line);
      padding: 8px 18px;
    }
    .btn:hover { background: var(--bright); color: var(--bg); border-color: var(--bright); }
    .btn:disabled { color: var(--dim); cursor: default; background: transparent; border-color: var(--line); }
    .status .btn { margin-top: 12px; }
    .more { display: block; margin: 32px auto 0; }

    /* ---------- Detail dialog ---------- */
    dialog {
      font: inherit;
      color: var(--text);
      background: var(--bg);
      border: 1px solid var(--bright);
      padding: 0;
      width: min(560px, calc(100% - 32px));
      max-height: calc(100% - 32px);
      margin: auto;
    }
    dialog::backdrop { background: rgba(0, 0, 0, .75); }

    .d-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 2ch;
      padding: 8px 16px;
      border-bottom: 1px solid var(--line);
      color: var(--dim);
      font-size: 13px;
    }
    .close {
      font: inherit;
      color: var(--bright);
      background: transparent;
      border: none;
      cursor: pointer;
      padding: 2px 6px;
    }
    .close:hover { background: var(--bright); color: var(--bg); }

    .d-body { padding: 20px 20px 24px; }
    .d-head { display: grid; grid-template-columns: 140px 1fr; gap: 20px; align-items: center; margin-bottom: 18px; }
    .d-head img { width: 140px; height: 140px; object-fit: contain; }
    .d-head h2 { font-size: 1.6rem; font-weight: 700; color: var(--bright); letter-spacing: -0.02em; line-height: 1.2; }
    .flavor { color: var(--dim); margin-bottom: 18px; }

    .kv { display: grid; grid-template-columns: 11ch 1fr; gap: 2px 0; margin-bottom: 20px; }
    .kv dt { color: var(--dim); }
    .kv dd { color: var(--bright); }

    .stats-title { color: var(--dim); font-weight: 400; font-size: 15px; margin-bottom: 6px; }
    .stat { display: grid; grid-template-columns: 9ch 4ch 1fr; gap: 0 1ch; white-space: nowrap; }
    .stat .label { color: var(--dim); }
    .stat .val { color: var(--bright); text-align: right; }
    .stat .bar { color: var(--bright); overflow: hidden; letter-spacing: -0.02em; }
    .stat .bar .empty { color: var(--line); }

    footer { margin-top: 56px; padding-top: 20px; border-top: 1px solid var(--line); color: var(--dim); font-size: 13px; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; }

    @media (max-width: 520px) {
      body { font-size: 14px; }
      .wrap { padding-top: 32px; }
      .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
      .count { margin-left: 0; }
      .d-head { grid-template-columns: 96px 1fr; gap: 14px; }
      .d-head img { width: 96px; height: 96px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <p class="path">adlune:<a href="/" title="Back to adrianlara.dev">~</a>/pokedex$</p>
      <h1>Pokédex</h1>
      <p class="sub">Pokémon data from PokéAPI, starting at #21. Select one to see its stats.</p>
    </header>

    <div class="controls">
      <div class="field search">
        <label for="search">search</label>
        <input id="search" type="search" placeholder="name or number" autocomplete="off" spellcheck="false">
      </div>
      <div class="field">
        <label for="typeFilter">type</label>
        <select id="typeFilter">
          <option value="">all</option>
        </select>
      </div>
      <p class="count" id="count" aria-live="polite"></p>
    </div>

    <div class="grid" id="grid"></div>
    <div class="status" id="status">Loading Pokémon…</div>
    <button class="btn more" id="more" hidden>Load more</button>

    <footer>
      <p>Data from <a href="https://pokeapi.co" target="_blank" rel="noopener">PokéAPI</a>. Fan project, not affiliated with Nintendo, Game Freak or The Pokémon Company.</p>
      <p><a href="/">adrianlara.dev</a></p>
    </footer>
  </div>

  <dialog id="detail" aria-labelledby="detailName"></dialog>

  <script>
    // ---------- Config ----------
    const START_URL = "https://pokeapi.co/api/v2/pokemon/?offset=20&limit=100";
    const ARTWORK = (id) =>
      `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/${id}.png`;
    const CONCURRENCY = 8;   
    const BAR_WIDTH = 20;    
    const BAR_MAX = 200;     

    const STAT_LABELS = {
      "hp": "hp", "attack": "attack", "defense": "defense",
      "special-attack": "sp.atk", "special-defense": "sp.def", "speed": "speed"
    };

    // ---------- State ----------
    let nextUrl = START_URL;
    const pokemon = [];            
    const cards = new Map();       
    const detailCache = new Map(); 
    const seenTypes = new Set();

    // ---------- Elements ----------
    const grid = document.getElementById("grid");
    const statusEl = document.getElementById("status");
    const moreBtn = document.getElementById("more");
    const searchEl = document.getElementById("search");
    const typeEl = document.getElementById("typeFilter");
    const countEl = document.getElementById("count");
    const dialog = document.getElementById("detail");

    // ---------- Helpers ----------
    const idFromUrl = (url) => Number(url.split("/").filter(Boolean).pop());
    const pad = (n) => "#" + String(n).padStart(4, "0");

    const SPECIAL_NAMES = { "nidoran-f": "Nidoran ♀", "nidoran-m": "Nidoran ♂", "mr-mime": "Mr. Mime", "farfetchd": "Farfetch’d" };
    function prettyName(name) {
      if (SPECIAL_NAMES[name]) return SPECIAL_NAMES[name];
      return name.split("-").map((w) => w.charAt(0).toUpperCase() + w.slice(1)).join(" ");
    }

    function el(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text !== undefined) node.textContent = text;
      return node;
    }

    const typeTag = (type) => el("span", "type", type);

    function asciiBar(value) {
      const filled = Math.max(1, Math.min(BAR_WIDTH, Math.round((value / BAR_MAX) * BAR_WIDTH)));
      const bar = el("span", "bar");
      bar.setAttribute("aria-hidden", "true");
      bar.append("█".repeat(filled), el("span", "empty", "░".repeat(BAR_WIDTH - filled)));
      return bar;
    }

    async function getJSON(url) {
      const res = await fetch(url);
      if (!res.ok) throw new Error(`Request failed (${res.status})`);
      return res.json();
    }

    async function getDetails(p) {
      if (detailCache.has(p.id)) return detailCache.get(p.id);
      const data = await getJSON(p.url);
      detailCache.set(p.id, data);
      return data;
    }

    async function runPool(items, worker, size) {
      let i = 0;
      const runners = Array.from({ length: Math.min(size, items.length) }, async () => {
        while (i < items.length) {
          const item = items[i++];
          try { await worker(item); } catch (e) { console.warn(e); }
        }
      });
      await Promise.all(runners);
    }

    // ---------- Rendering ----------
    function createCard(p) {
      const card = el("button", "card");
      card.type = "button";
      card.setAttribute("aria-label", `${prettyName(p.name)}, ${pad(p.id)}. Show details`);

      const img = el("img");
      img.src = ARTWORK(p.id);
      img.alt = "";
      img.loading = "lazy";
      img.width = 160; img.height = 160;

      const types = el("div", "types");
      types.append(el("span", "pending", "loading…"));

      card.append(img, el("span", "num", pad(p.id)), el("span", "name", prettyName(p.name)), types);
      card.addEventListener("click", () => openDetail(p));
      cards.set(p.id, card);
      return card;
    }

    function fillTypes(p) {
      const box = cards.get(p.id).querySelector(".types");
      box.replaceChildren(...p.types.map(typeTag));
    }

    function addTypeOption(type) {
      if (seenTypes.has(type)) return;
      seenTypes.add(type);
      const options = [...seenTypes].sort();
      const current = typeEl.value;
      typeEl.replaceChildren(new Option("all", ""), ...options.map((t) => new Option(t, t)));
      typeEl.value = current;
    }

    function applyFilters() {
      const q = searchEl.value.trim().toLowerCase().replace(/^#/, "");
      const type = typeEl.value;
      let shown = 0;

      for (const p of pokemon) {
        const matchesText = !q || p.name.includes(q) || prettyName(p.name).toLowerCase().includes(q) || String(p.id) === q.replace(/^0+/, "");
        const matchesType = !type || (p.types && p.types.includes(type));
        const visible = matchesText && matchesType;
        cards.get(p.id).hidden = !visible;
        if (visible) shown++;
      }

      countEl.textContent = `${shown} of ${pokemon.length} shown`;
      if (pokemon.length && shown === 0) {
        statusEl.hidden = false;
        statusEl.textContent = "No Pokémon match. Try a different name, number or type.";
      } else if (pokemon.length) {
        statusEl.hidden = true;
      }
    }

    // ---------- Loading ----------
    async function loadPage() {
      if (!nextUrl) return;
      moreBtn.disabled = true;
      moreBtn.textContent = "Loading…";

      try {
        const data = await getJSON(nextUrl);
        nextUrl = data.next;

        const batch = data.results.map((r) => ({ id: idFromUrl(r.url), name: r.name, url: r.url, types: null }));
        pokemon.push(...batch);
        grid.append(...batch.map(createCard));
        applyFilters();

        moreBtn.hidden = !nextUrl;
        moreBtn.disabled = false;
        moreBtn.textContent = "Load more";

        // Fill in types in the background
        await runPool(batch, async (p) => {
          const d = await getDetails(p);
          p.types = d.types.map((t) => t.type.name);
          p.types.forEach(addTypeOption);
          fillTypes(p);
        }, CONCURRENCY);
        applyFilters();
      } catch (err) {
        moreBtn.disabled = false;
        moreBtn.textContent = "Load more";
        statusEl.hidden = false;
        const retry = el("button", "btn", "Retry");
        retry.onclick = loadPage;
        statusEl.replaceChildren(el("p", "", "Couldn’t reach PokéAPI. Check your connection, then retry."), retry);
      }
    }

    // ---------- Detail dialog ----------
    function dialogBar(label) {
      const bar = el("div", "d-bar");
      const close = el("button", "close", "close [esc]");
      close.type = "button";
      close.onclick = () => dialog.close();
      bar.append(el("span", "", label), close);
      return bar;
    }

    async function openDetail(p) {
      dialog.replaceChildren(dialogBar(`pokedex/${p.name}`), el("div", "status d-body", "Loading…"));
      dialog.showModal();

      try {
        const d = await getDetails(p);

        // Header
        const head = el("div", "d-head");
        const img = el("img");
        img.src = d.sprites.other?.["official-artwork"]?.front_default || d.sprites.front_default || ARTWORK(p.id);
        img.alt = prettyName(d.name);

        const info = el("div");
        const title = el("h2", "", prettyName(d.name));
        title.id = "detailName";
        const types = el("div", "types");
        types.append(...d.types.map((t) => typeTag(t.type.name)));
        info.append(el("p", "num", pad(d.id)), title, types);
        head.append(img, info);

        const flavor = el("p", "flavor");

        // Key/value facts
        const kv = el("dl", "kv");
        const row = (k, v) => kv.append(el("dt", "", k), el("dd", "", v));
        row("height", `${(d.height / 10).toFixed(1)} m`);
        row("weight", `${(d.weight / 10).toFixed(1)} kg`);
        row("abilities", d.abilities.map((a) => a.ability.name).join(", "));

        // ASCII stat bars
        const stats = el("div");
        stats.append(el("h3", "stats-title", "base stats"));
        for (const s of d.stats) {
          const line = el("div", "stat");
          line.setAttribute("aria-label", `${STAT_LABELS[s.stat.name] || s.stat.name}: ${s.base_stat}`);
          line.append(
            el("span", "label", STAT_LABELS[s.stat.name] || s.stat.name),
            el("span", "val", String(s.base_stat)),
            asciiBar(s.base_stat)
          );
          stats.append(line);
        }

        const body = el("div", "d-body");
        body.append(head, flavor, kv, stats);
        dialog.replaceChildren(dialogBar(`pokedex/${d.name}`), body);

        getJSON(d.species.url).then((species) => {
          const entry = species.flavor_text_entries.find((e) => e.language.name === "en");
          if (entry) flavor.textContent = entry.flavor_text.replace(/[\f\n\r]+/g, " ");
        }).catch(() => {});
      } catch (err) {
        dialog.replaceChildren(dialogBar(`pokedex/${p.name}`), el("div", "status d-body", "Couldn’t load this Pokémon. Close this and select it again."));
      }
    }

    // Close the dialog when clicking the backdrop
    dialog.addEventListener("click", (e) => { if (e.target === dialog) dialog.close(); });

    // ---------- Wire up ----------
    searchEl.addEventListener("input", applyFilters);
    typeEl.addEventListener("change", applyFilters);
    moreBtn.addEventListener("click", loadPage);

    loadPage();
  </script>
</body>
</html>
